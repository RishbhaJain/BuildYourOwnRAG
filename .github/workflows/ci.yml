name: Evaluation metric tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install "pytest>=8,<10"

      - name: Run evaluation metric tests
        run: python -m pytest -q tests/test_evaluation.py
