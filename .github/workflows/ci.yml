name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check formatting and lint
        run: |
          python -m ruff format --check \
            service \
            benchmarks \
            llm.py \
            llms/llm_pipeline.py \
            tests/test_cache.py \
            tests/test_live_benchmark.py \
            tests/test_llm.py \
            tests/test_service_api.py \
            tests/test_service_pipeline.py \
            retriever/dense_retriever.py
          python -m ruff check \
            service \
            benchmarks \
            llm.py \
            llms/llm_pipeline.py \
            tests/test_cache.py \
            tests/test_live_benchmark.py \
            tests/test_llm.py \
            tests/test_service_api.py \
            tests/test_service_pipeline.py \
            retriever/dense_retriever.py

      - name: Run active evaluation and service tests
        run: |
          python -m pytest -q \
            tests/test_evaluation.py \
            tests/test_cache.py \
            tests/test_llm.py \
            tests/test_live_benchmark.py \
            tests/test_service_pipeline.py \
            tests/test_service_api.py

      - name: Run reproducible mock benchmark
        run: |
          python -m benchmarks.benchmark_service \
            --iterations 100 \
            --warmup 10 \
            --output-dir /tmp/rag-benchmark

  container-smoke-test:
    needs: service-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build lightweight test image
        run: docker build --build-arg INSTALL_ML_DEPS=0 -t build-your-own-rag:test .

      - name: Start mock service
        run: |
          docker run -d \
            --name rag-api \
            -e RAG_MODE=mock \
            -p 8000:8000 \
            build-your-own-rag:test

      - name: Exercise health, answer, and metrics endpoints
        run: |
          rag_ready=false
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ready; then
              rag_ready=true
              break
            fi
            sleep 2
          done

          if [ "$rag_ready" != "true" ]; then
            docker logs rag-api
            exit 1
          fi

          curl -fsS http://127.0.0.1:8000/health
          curl -fsS \
            -X POST http://127.0.0.1:8000/answer \
            -H "Content-Type: application/json" \
            -d '{"question":"What is tested?","top_k":2}'
          curl -fsS http://127.0.0.1:8000/metrics | grep -q "rag_stage_latency_seconds"

      - name: Exercise live benchmark schema against mock service
        run: |
          python -m benchmarks.benchmark_live \
            --base-url http://127.0.0.1:8000 \
            --questions questions.txt \
            --limit 3 \
            --concurrency 1,2 \
            --output /tmp/live-benchmark.json
          python -c "import json; data=json.load(open('/tmp/live-benchmark.json')); assert len(data['results']) == 4"

      - name: Show container logs
        if: always()
        run: docker logs rag-api || true

      - name: Stop container
        if: always()
        run: docker rm -f rag-api || true
